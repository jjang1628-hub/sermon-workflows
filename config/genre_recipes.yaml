# Genre Recipes - Logos-Max Sermon Workflow v2.1

version: "2.1"

genres:
  gospel:
    label: "복음서"
    priority_categories:
      - text_establishment
      - original_language
      - cross_references
      - commentaries
      - background
      - structure_discourse
      - biblical_theology
    cautions:
      - "인물 영웅화 금지"
      - "기적과 모범을 구속사적 의미 없이 윤리로만 축소하지 말 것"

  gospel_farewell_discourse:
    label: "복음서 - 고별 담화"
    required:
      - text_establishment
      - translation_comparison
      - original_language
      - structure_discourse
      - cross_references
      - commentaries
      - biblical_theology
    recommended:
      - systematic_theology
      - application_pastoral
      - background
    emphasis:
      - "고별 담화 전체 흐름"
      - "제자 공동체 형성"
      - "십자가 전 문맥"
      - "사랑과 순종의 관계"
      - "그리스도의 낮아지심"

  gospel_symbolic_action:
    label: "복음서 - 상징 행위"
    required:
      - text_establishment
      - original_language
      - background
      - biblical_theology
      - commentaries
    recommended:
      - structure_discourse
      - systematic_theology
      - application_pastoral
    emphasis:
      - "상징 행위와 십자가 연결"
      - "행위가 설명되는 문맥"
      - "과도한 알레고리 경계"

  gospel_discipleship:
    label: "복음서 - 제자도"
    required:
      - structure_discourse
      - cross_references
      - application_pastoral
      - biblical_theology
    recommended:
      - sermon_homiletics
      - systematic_theology
    emphasis:
      - "명령 이전의 은혜"
      - "제자 공동체의 삶"
      - "도덕주의 위험 점검"

  gospel_parable:
    label: "복음서 - 비유"
    required:
      - text_establishment
      - structure_discourse
      - background
      - commentaries
      - biblical_theology
    emphasis:
      - "비유의 청중과 논쟁 상황"
      - "비유의 전환점"
      - "과도한 세부 알레고리 경계"

  gospel_miracle:
    label: "복음서 - 기적"
    required:
      - text_establishment
      - structure_discourse
      - cross_references
      - commentaries
      - biblical_theology
    emphasis:
      - "기적의 표적성"
      - "그리스도의 권위와 긍휼"
      - "번영주의 적용 경계"

  epistle:
    label: "서신서"
    priority_categories:
      - text_establishment
      - original_language
      - structure_discourse
      - cross_references
      - commentaries
      - systematic_theology
      - biblical_theology
    cautions:
      - "indicative 없이 imperative만 설교하지 말 것"

  epistle_doctrinal:
    label: "서신서 - 교리 논증"
    required:
      - text_establishment
      - original_language
      - structure_discourse
      - commentaries
      - systematic_theology
      - biblical_theology
    emphasis:
      - "논증 흐름"
      - "교리와 복음의 연결"
      - "교리 나열이 아닌 예배와 순종으로의 흐름"

  epistle_exhortation:
    label: "서신서 - 권면"
    required:
      - text_establishment
      - structure_discourse
      - original_language
      - application_pastoral
      - commentaries
    emphasis:
      - "복음의 은혜에서 나오는 명령"
      - "교회 공동체 정체성"
      - "도덕주의 위험 점검"

  torah_law:
    label: "토라 - 율법"
    required:
      - text_establishment
      - background
      - original_language
      - cross_references
      - biblical_theology
      - commentaries
    emphasis:
      - "거룩과 중보"
      - "그리스도 안에서의 성취"
      - "직접 적용 경계"

  torah_narrative:
    label: "토라 - 서사"
    required:
      - text_establishment
      - structure_discourse
      - background
      - cross_references
      - biblical_theology
      - commentaries
    emphasis:
      - "언약 흐름"
      - "하나님의 주도적 행위"
      - "인물 영웅화 경계"

  psalm_lament:
    label: "시편 - 탄식"
    required:
      - text_establishment
      - structure_discourse
      - original_language
      - cross_references
      - biblical_theology
      - commentaries
    emphasis:
      - "탄식에서 신뢰로 가는 흐름"
      - "그리스도 안에서의 기도"
      - "감정 표현의 단순화 경계"

  psalm_praise:
    label: "시편 - 찬양"
    required:
      - text_establishment
      - structure_discourse
      - original_language
      - biblical_theology
      - commentaries
    emphasis:
      - "하나님의 성품과 행위"
      - "예배 공동체"
      - "찬양의 근거"

  prophetic_judgment:
    label: "예언서 - 심판"
    required:
      - text_establishment
      - background
      - structure_discourse
      - cross_references
      - commentaries
      - biblical_theology
    emphasis:
      - "언약 소송"
      - "죄와 심판"
      - "복음 없는 정죄 설교 경계"

  prophetic_restoration:
    label: "예언서 - 회복"
    required:
      - text_establishment
      - background
      - cross_references
      - commentaries
      - biblical_theology
    emphasis:
      - "남은 자"
      - "새 언약"
      - "그리스도 안의 성취"
