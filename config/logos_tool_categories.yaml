# Logos 도구 분류 — Logos-Max Sermon Workflow v2
# 12개 자료군 정의. coverage rubric, recipe, checklist에서 이 분류를 공통으로 사용한다.

categories:

  text_establishment:
    id: CAT-01
    label: "본문 확정"
    tools:
      - Passage Guide
      - Text Comparison
      - Bible Browser
    purpose: "본문 범위와 번역 차이를 확인한다."
    capture_hint: "개역개정·NASB·ESV 비교. 본문 시작·끝 경계 확인."
    required: true

  original_language:
    id: CAT-02
    label: "원어·문법"
    tools:
      - Exegetical Guide
      - Bible Word Study
      - Interlinear
      - Morph Search
    purpose: "본문 의미를 실제로 선명하게 하는 원어 요소만 확인한다."
    capture_hint: "핵심 동사·명사 1–3개 집중. BDAG/HALOT 정의 요약."
    required: true

  structure_discourse:
    id: CAT-03
    label: "구조·담화"
    tools:
      - Passage Analysis
      - Clause Search
      - Discourse Dataset
    purpose: "반복, 대조, 전환, 흐름을 확인한다."
    capture_hint: "주동사 흐름, 접속사 패턴, 반복어 목록 캡처."
    required: false

  cross_references:
    id: CAT-04
    label: "교차본문"
    tools:
      - Treasury of Scripture Knowledge
      - Cross References
      - Important Passages
    purpose: "정경적 연결을 확인한다."
    capture_hint: "직접 인용·암시 구분. 핵심 교차본문 5개 이내."
    required: true

  commentaries:
    id: CAT-05
    label: "주석"
    tools:
      - Passage Guide Commentaries
    purpose: "주요 해석 견해를 비교한다."
    capture_hint: "최소 3개 주석 (Keener, Carson 또는 동등 수준). 견해 차이 명시."
    required: true

  biblical_theology:
    id: CAT-06
    label: "성경신학"
    tools:
      - Biblical Theology resources
      - Factbook themes
    purpose: "본문이 성경 전체에서 어디에 놓이는지 확인한다."
    capture_hint: "핵심 신학 테마 (언약, 구속, 왕국 등)와 본문의 연결 확인."
    required: false

  systematic_theology:
    id: CAT-07
    label: "조직신학"
    tools:
      - Theology Guide
      - Systematic Theology resources
    purpose: "교리적 연결을 말씀 아래 보조 증인으로 사용한다."
    capture_hint: "교리를 먼저 가져오지 말 것. 본문 이후 확인 용도."
    required: false

  background:
    id: CAT-08
    label: "역사·문화·배경"
    tools:
      - Factbook
      - Bible Dictionaries
      - Atlas
    purpose: "본문 이해에 필요한 배경만 확인한다."
    capture_hint: "과도한 배경 자료 금지. 설교에 직접 기여하는 내용만."
    required: false

  sermon_homiletics:
    id: CAT-09
    label: "설교 자료"
    tools:
      - Sermon Starter Guide
      - Sermon Builder
    purpose: "구조와 전달 아이디어를 보조 자료로 사용한다."
    capture_hint: "도덕주의·인물영웅화 방향 아이디어 거름. 복음 프레임만 채택."
    required: false

  application_pastoral:
    id: CAT-10
    label: "목회·적용"
    tools:
      - Counseling resources
      - Pastoral theology resources
    purpose: "성도 현실과 적용 가능성을 점검한다."
    capture_hint: "복음에서 출발하는 적용만 채택. 율법적 적용 거름."
    required: false

  media_teaching:
    id: CAT-11
    label: "시각·교육자료"
    tools:
      - Media
      - Visual Copy
      - Atlas images
    purpose: "PPT와 교육 자료 후보를 찾는다."
    capture_hint: "사용할 이미지 파일명과 설명만 기록."
    required: false

  notes_personal:
    id: CAT-12
    label: "개인 노트"
    tools:
      - Notes
      - Clippings
      - Sermon Documents
    purpose: "이전 연구와 목회적 통찰을 연결한다."
    capture_hint: "이전 설교·묵상 기록과의 연결점 확인."
    required: false
