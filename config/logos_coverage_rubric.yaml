# Logos Coverage Rubric - Logos-Max Sermon Workflow v2.1
#
# Coverage Score asks whether required Logos research categories are present.
# It does not judge depth. Depth is evaluated by Capture Quality Score.

version: "2.1"

items:
  - id: R-01
    category: text_establishment
    label: "본문 범위·문맥 확인"
    points: 10
    description: "본문 경계와 앞뒤 문맥을 확인한다."

  - id: R-02
    category: translation_comparison
    label: "번역 비교"
    points: 10
    description: "주요 번역 간 차이를 확인한다."

  - id: R-03
    category: original_language
    label: "원어·문법"
    points: 15
    description: "본문 의미를 실제로 선명하게 하는 핵심 원어·문법만 확인한다."

  - id: R-04
    category: structure_discourse
    label: "구조·담화"
    points: 10
    description: "단락 흐름, 반복, 대조, 전환, 절정을 확인한다."

  - id: R-05
    category: cross_references
    label: "교차본문"
    points: 10
    description: "정경적 연결과 억지 연결 위험을 함께 확인한다."

  - id: R-06
    category: commentaries
    label: "주석 비교"
    points: 15
    description: "주요 주석 견해를 비교하고 설교 반영 여부를 판단한다."

  - id: R-07
    category: biblical_theology
    label: "성경신학"
    points: 10
    description: "구속사, 정경 흐름, 그리스도 성취를 본문 아래에서 확인한다."

  - id: R-08
    category: systematic_theology
    label: "조직신학"
    points: 5
    description: "교리적 연결을 말씀 아래 보조 증인으로 사용한다."

  - id: R-09
    category: background
    label: "역사·문화 배경"
    points: 5
    description: "본문 이해에 실제로 기여하는 배경만 확인한다."

  - id: R-10
    category: sermon_homiletics
    label: "설교 자료"
    points: 5
    description: "구조와 전달 아이디어를 보조 자료로 사용한다."

  - id: R-11
    category: application_pastoral
    label: "목회·적용"
    points: 5
    description: "원청중·오늘 청중·거짓 복음·한 순종을 점검한다."

total_points: 100

thresholds:
  logos_max_deep_eligible:
    coverage: 90
    status: "logos_max_deep_eligible"
    action: "run_deep_research"

  deep_eligible:
    coverage: 75
    status: "deep_eligible"
    action: "run_deep_research"

  review_required:
    coverage: 60
    status: "review_required"
    action: "request_more_captures"

  insufficient:
    coverage: 0
    status: "insufficient"
    action: "stop_pipeline"
