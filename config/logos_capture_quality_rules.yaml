# Logos Capture Quality Rules - Logos-Max v2.1
#
# Capture Quality Score asks whether captured Logos material is actually useful
# for exegesis, theological integration, and sermon direction.

version: "2.1"

commentaries:
  label: "주석 비교"
  points: 20
  min_sources: 2
  required_elements:
    - interpretive_summary
    - interpretive_comparison
    - sermon_application
  warning_if_missing:
    - "주석 견해가 2개 미만입니다."
    - "해석 차이점이 정리되지 않았습니다."
    - "설교 반영 판단이 없습니다."

cross_references:
  label: "교차본문"
  points: 15
  min_references: 3
  required_elements:
    - connection_reason
    - canonical_direction
    - risk_check
  warning_if_missing:
    - "교차본문 연결 이유가 부족합니다."
    - "억지 연결 위험 검토가 없습니다."

biblical_theology:
  label: "성경신학"
  points: 20
  required_elements:
    - covenant_connection
    - redemptive_history
    - christ_fulfillment
    - anti_allegory
  warning_if_missing:
    - "그리스도 성취 논리가 약합니다."
    - "정경적 위치 설명이 부족합니다."
    - "억지 알레고리 위험 점검이 없습니다."

original_language:
  label: "원어·문법"
  points: 15
  max_public_terms: 3
  required_elements:
    - key_terms
    - contextual_meaning
    - sermon_relevance
    - overuse_warning
  warning_if_missing:
    - "원어가 본문 의미를 실제로 선명하게 하는지 불분명합니다."
    - "원어 과시 위험 점검이 없습니다."

structure_discourse:
  label: "구조·담화"
  points: 10
  required_elements:
    - paragraph_flow
    - repetition_contrast
    - turning_point
  warning_if_missing:
    - "단락 흐름 분석이 부족합니다."
    - "반복·대조·전환 관찰이 부족합니다."

background:
  label: "역사·문화 배경"
  points: 10
  required_elements:
    - relevant_background
    - textual_contribution
    - overuse_warning
  warning_if_missing:
    - "배경 정보가 본문 해석에 어떻게 기여하는지 불분명합니다."

application_pastoral:
  label: "목회·적용"
  points: 10
  required_elements:
    - false_gospel_diagnosis
    - gospel_motive
    - one_obedience
  warning_if_missing:
    - "오늘 청중의 자기구원 방식 진단이 부족합니다."
    - "복음의 은혜에서 출발하는 적용 구조가 약합니다."
    - "이번 주 한 순종이 분명하지 않습니다."

thresholds:
  logos_max_deep_eligible:
    coverage: 90
    quality: 80
  deep_eligible:
    coverage: 75
    quality: 70
  review_required:
    coverage: 75
    quality: 60
  capture_incomplete:
    coverage: 60
  quality_blocked:
    quality: 60
