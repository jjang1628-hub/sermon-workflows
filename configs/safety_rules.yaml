# safety_rules.yaml — 안전 규칙 (불변 원칙)

---
version: "1.0"
description: "Logos-Max 자동화 시스템의 불변 안전 규칙"

# 파일 보호 규칙
file_protection:
  rules:
    - id: "FP-01"
      rule: "기존 파일 직접 덮어쓰기 금지"
      enforcement: "output_path.exists()이면 --force 없이 중단"
      violation_action: "error"
    - id: "FP-02"
      rule: "--force 단독 덮어쓰기 금지"
      enforcement: "--force 사용 시 backup + temp replace 패턴 강제"
      pattern: |
        backup = output_path.with_suffix('.bak')
        shutil.copy2(output_path, backup)
        temp = output_path.with_suffix('.tmp')
        write_to(temp)
        temp.rename(output_path)
      violation_action: "error"
    - id: "FP-03"
      rule: "원본 캡처 파일 수정 금지"
      enforcement: "tmp/logos-capture/raw/ 파일은 읽기 전용"
      violation_action: "error"

# Logos 접근 규칙
logos_access:
  rules:
    - id: "LA-01"
      rule: "Logos 내부 DB 직접 접근 금지"
      enforcement: "logos4: URI와 UI 조작만 허용"
      violation_action: "block"
    - id: "LA-02"
      rule: "설치 폴더 리소스 직접 추출 금지"
      enforcement: "Logos 설치 경로 파일 읽기 금지"
      violation_action: "block"
    - id: "LA-03"
      rule: "유료 자료 대량 스크래핑 금지"
      enforcement: "단일 본문 캡처만 허용, 반복 자동 캡처 제한"
      violation_action: "block"
    - id: "LA-04"
      rule: "공식 UI / Copy / Export / Print로 확보한 자료만 분석"
      enforcement: "캡처 출처 메타데이터 요구"
      violation_action: "warning"
    - id: "LA-05"
      rule: "장문 원문 인용 금지"
      enforcement: "단일 자료에서 최대 500자 인용"
      max_quote_chars: 500
      violation_action: "truncate_with_warning"

# 신학 안전 규칙
theological_safety:
  rules:
    - id: "TS-01"
      rule: "로컬 LLM 결과에 '1차 분석 초안' 레이블 필수"
      enforcement: "출력 파일에 레이블 없으면 post-process 추가"
      required_label: "⚠️ 1차 분석 초안 — 목사님 검토 필요"
      violation_action: "add_label"
    - id: "TS-02"
      rule: "인물 영웅화 감지 시 경고"
      enforcement: "영웅화 키워드 패턴 감지 후 경고 메시지 추가"
      detection_patterns:
        - "모범을 보이셨습니다"
        - "귀감이 됩니다"
        - "우리도 이처럼"
      violation_action: "warning_in_output"
    - id: "TS-03"
      rule: "율법적 적용 감지 시 경고"
      enforcement: "복음 기반 없는 명령형 적용 감지"
      detection_patterns:
        - "^우리는 반드시"
        - "^해야만 합니다"
        - "~하지 않으면"
      violation_action: "warning_in_output"
    - id: "TS-04"
      rule: "Counter-Reading Pass 생략 불가"
      enforcement: "Deep/Expert 모드에서 counter-reading 파일 없으면 완료 거부"
      violation_action: "block_completion"

# 출력 안전 규칙
output_safety:
  rules:
    - id: "OS-01"
      rule: "민감한 개인정보 출력 금지"
      enforcement: "교인 이름, 개인 상황 등 출력 파일에 포함 금지"
      violation_action: "block"
    - id: "OS-02"
      rule: "설교 최종본으로 오인될 수 있는 표현 금지"
      enforcement: "출력에 '이것은 연구 보조 자료입니다' 레이블 포함"
      required_footer: "⚠️ 이 자료는 연구 보조 자료입니다. 최종 설교는 목사님이 직접 작성하세요."
      violation_action: "add_footer"

# 실행 안전 규칙
execution_safety:
  rules:
    - id: "ES-01"
      rule: "API 키 환경변수 외 노출 금지"
      enforcement: "ANTHROPIC_API_KEY를 코드에 하드코딩 금지"
      violation_action: "block"
    - id: "ES-02"
      rule: "Ollama 서버 확인 먼저"
      enforcement: "generate 호출 전 /api/tags 확인"
      violation_action: "error_with_guidance"
    - id: "ES-03"
      rule: "출력 디렉토리 자동 생성"
      enforcement: "mkdir -p 패턴으로 안전하게 생성"
      violation_action: "create_dir"

---
# 위반 심각도

severity_levels:
  block: "실행 완전 중단 — 사용자 확인 필요"
  error: "오류 반환 — 재실행 가능"
  warning: "경고 메시지 출력 — 계속 진행"
  add_label: "자동으로 레이블/푸터 추가 후 계속"
  truncate_with_warning: "내용 자르고 경고 추가"
