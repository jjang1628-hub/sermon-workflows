# output_contracts.yaml — 모드별 필수 출력 계약

---
version: "1.0"
description: "각 운영 모드에서 반드시 생성해야 하는 출력 파일 목록"

contracts:

  quick:
    label: "Quick 모드 (15–20분)"
    use_case: "당일 설교 준비, 소그룹 인도"
    required_outputs:
      - id: "QK-01"
        name: "research_summary"
        description: "핵심 관찰·해석·적용 요약 (1페이지)"
        file_pattern: "output/deep_research/{slug}-quick-summary.md"
      - id: "QK-02"
        name: "big_idea"
        description: "설교 Big Idea 한 문장"
        file_pattern: "embedded in QK-01"
      - id: "QK-03"
        name: "key_words"
        description: "핵심 단어 3–5개 + 간략 원어 설명"
        file_pattern: "embedded in QK-01"
      - id: "QK-04"
        name: "christ_connection"
        description: "그리스도 연결 포인트"
        file_pattern: "embedded in QK-01"
      - id: "QK-05"
        name: "application_3"
        description: "복음 기반 적용 3개"
        file_pattern: "embedded in QK-01"
      - id: "QK-06"
        name: "one_obedience"
        description: "이번 주 한 가지 순종"
        file_pattern: "embedded in QK-01"
      - id: "QK-07"
        name: "internalization_basics"
        description: "Big Idea + 강단 닻 문장"
        file_pattern: "embedded in QK-01"
    total_required: 7

  standard:
    label: "Standard 모드 (40–60분)"
    use_case: "주간 설교 준비"
    required_outputs:
      - id: "ST-01"
        name: "research_pack"
        description: "11섹션 연구 팩"
        file_pattern: "output/research_packs/{slug}-research-pack.md"
      - id: "ST-02"
        name: "deep_research_report"
        description: "20-Pass 심층 연구 보고서"
        file_pattern: "output/deep_research/{slug}-deep-research.md"
      - id: "ST-03"
        name: "evidence_ledger"
        description: "Evidence Ledger"
        file_pattern: "output/evidence_ledgers/{slug}-evidence-ledger.md"
      - id: "ST-04"
        name: "claim_audit"
        description: "12문항 Claim Audit"
        file_pattern: "output/claim_audits/{slug}-claim-audit.md"
      - id: "ST-05"
        name: "counter_reading"
        description: "8관점 Counter-Reading"
        file_pattern: "output/deep_research/{slug}-counter-reading.md"
      - id: "ST-06"
        name: "sermon_direction"
        description: "설교 방향 제안서"
        file_pattern: "output/final_sermon_direction/{slug}-sermon-direction.md"
      - id: "ST-07"
        name: "internalization_7"
        description: "7가지 내면화 압축본"
        file_pattern: "embedded in ST-06"
      - id: "ST-08"
        name: "big_idea"
        description: "설교 Big Idea"
        file_pattern: "embedded in ST-06"
      - id: "ST-09"
        name: "application_structure"
        description: "복음→동기→순종 적용 구조"
        file_pattern: "embedded in ST-06"
      - id: "ST-10"
        name: "confidence_map"
        description: "주장별 신뢰도 지도"
        file_pattern: "embedded in ST-03"
      - id: "ST-11"
        name: "additional_research_recs"
        description: "추가 연구 권장 사항"
        file_pattern: "embedded in ST-02"
    total_required: 11

  deep:
    label: "Deep 모드 (2–3시간)"
    use_case: "새 시리즈 시작, 어려운 본문"
    required_outputs:
      # ST-01 ~ ST-11 모두 포함 +
      - id: "DP-01"
        name: "logos_research_recipe"
        description: "Logos 연구 레시피 (어떤 도구, 어떤 순서로)"
        file_pattern: "output/research_packs/{slug}-logos-recipe.md"
      - id: "DP-02"
        name: "ollama_first_pass"
        description: "Ollama 1차 분석 초안"
        file_pattern: "output/local_research/{slug}-local-research.md"
      - id: "DP-03"
        name: "commentary_comparison_table"
        description: "주석 3종 이상 비교 표"
        file_pattern: "embedded in ST-02"
      - id: "DP-04"
        name: "original_language_analysis"
        description: "원어 심층 분석 (핵심 단어 3개 이상)"
        file_pattern: "embedded in ST-02"
      - id: "DP-05"
        name: "historical_cultural_background"
        description: "역사·문화 배경 전체 섹션"
        file_pattern: "embedded in ST-02"
      - id: "DP-06"
        name: "redemptive_historical_position"
        description: "구속사 위치 분석"
        file_pattern: "embedded in ST-02"
      - id: "DP-07"
        name: "alternative_interpretations_2plus"
        description: "대안 해석 2개 이상"
        file_pattern: "embedded in ST-05"
      - id: "DP-08"
        name: "preacher_internalization_full"
        description: "7가지 내면화 + 암송 훈련 문장"
        file_pattern: "output/final_sermon_direction/{slug}-internalization.md"
      - id: "DP-09"
        name: "claim_audit_full_table"
        description: "전체 주장 감사 표"
        file_pattern: "output/claim_audits/{slug}-claim-audit.md"
      - id: "DP-10"
        name: "weakness_report"
        description: "약점 및 주의사항 보고서"
        file_pattern: "embedded in ST-02"
      - id: "DP-11"
        name: "capture_validation_report"
        description: "캡처 검증 게이트 결과"
        file_pattern: "output/research_packs/{slug}-capture-validation.md"
      - id: "DP-12"
        name: "sermon_outline_draft"
        description: "설교 개요 초안 (3대지 + 서론·결론)"
        file_pattern: "output/final_sermon_direction/{slug}-outline-draft.md"
      - id: "DP-13"
        name: "small_group_guide"
        description: "소그룹 나눔지"
        file_pattern: "output/{slug}-small-group-guide.md"
      - id: "DP-14"
        name: "ppt_draft"
        description: "PPT 초안"
        file_pattern: "output/{slug}-ppt-draft.md"
      - id: "DP-15"
        name: "short_summary"
        description: "짧은 요약"
        file_pattern: "output/{slug}-short-summary.md"
      - id: "DP-16"
        name: "missing_data_report"
        description: "누락 자료 보고서"
        file_pattern: "embedded in DP-11"
      - id: "DP-17"
        name: "logos_library_used"
        description: "실제 사용된 Logos 자료 목록"
        file_pattern: "embedded in ST-01"
    total_required: 28   # 11 (ST) + 17 (DP)

  expert:
    label: "Expert 모드 (4시간+)"
    use_case: "강해 시리즈, 학문적 깊이"
    required_outputs:
      # Deep 모드 28개 모두 + 추가
      - id: "EX-01"
        name: "bavinck_dogmatic_connection"
        description: "바빙크 교의학 연결 분석"
        file_pattern: "output/deep_research/{slug}-dogmatics.md"
      - id: "EX-02"
        name: "series_context"
        description: "시리즈 전체 맥락에서의 위치"
        file_pattern: "output/final_sermon_direction/{slug}-series-context.md"
      - id: "EX-03"
        name: "full_commentary_notes"
        description: "주석 5종 이상 상세 노트"
        file_pattern: "embedded in DP-02"
    total_required: 31   # 28 (Deep) + 3 (EX)

---
# 검증 규칙

validation_rules:
  missing_required: "error"     # 필수 출력 누락 시 에러
  empty_file: "warning"         # 빈 파일 경고
  min_size_bytes:
    research_pack: 2000
    deep_research: 5000
    evidence_ledger: 1000
    claim_audit: 1000
    sermon_direction: 2000
