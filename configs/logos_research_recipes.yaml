    patterns: ["마 ", "막 ", "눅 ", "요 "]
  epistle:
    keywords: ["로마서", "고린도", "갈라디아서", "에베소서", "빌립보서",
               "골로새서", "데살로니가", "디모데", "디도서", "빌레몬서",
               "히브리서", "야고보서", "베드로", "요한일서", "요한이서",
               "요한삼서", "유다서"]
  psalm_wisdom:
    keywords: ["시편", "잠언", "전도서", "아가", "욥기"]
