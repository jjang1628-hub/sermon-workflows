    keywords: ["이사야", "예레미야", "에스겔", "다니엘", "호세아",
               "요엘", "아모스", "미가", "스가랴", "요한계시록"]
  ot_narrative:
    keywords: ["창세기", "출애굽기", "여호수아", "사사기", "룻기",
